# for a description of available keys, see https://github.com/typst/packages/?tab=readme-ov-file#package-format

[package]
entrypoint = "src/defs.typ"
# name = "kuleuven-engineering-science-thesis"
name = "ktt"
version = "0.1.0"
compiler = "0.11.0"
authors = ["Benjamin Eeckhout <https://github.com/benjamineeckh>"]
repository = "https://github.com/benjamineeckh/kul-typst-template"
description = "thesis template for engineering science at KU Leuven"
keywords = ["thesis", "KU Leuven", "Katholieke Universiteit Leuven", "Catholic university Leuven"]
categories = ["thesis"]
license = "MIT"
exclude = [
	".github",
	"docs",
	"scripts",
	"tests",
	".typstignore",
	"Justfile",
	"references"
]

[template]
path = "template"
entrypoint = "main.typ"